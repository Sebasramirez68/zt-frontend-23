# Sitio del Frontend. __DOMAIN__ lo reemplaza el user-data.
# Certbot (--nginx) agrega después el bloque 443 con el certificado y la redirección 80 -> 443.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/zt-frontend;
    index index.html;

    server_tokens off;                 # No revelar versión de Nginx
    client_max_body_size 16k;          # El login no necesita más

    # ---------- Encabezados de seguridad (SecurityHeaders.com) ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # ---------- API: proxy privado hacia el Backend por VPC Peering ----------
    location /api/ {
        proxy_pass http://10.23.2.10:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # ---------- SPA (React Router) ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }
}
